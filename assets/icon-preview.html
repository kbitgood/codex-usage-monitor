<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Monitor icon preview</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182230; background: #edf1f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
    main { width: min(100%, 850px); }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 20px; }
    h1 { font-size: clamp(24px, 4vw, 38px); letter-spacing: -.045em; font-weight: 650; margin: 0; }
    header span, .eyebrow, output, .size-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
    header span { color: #657080; white-space: nowrap; }
    .stage { height: min(56vh, 480px); min-height: 320px; display: grid; place-items: center; overflow: hidden; border-radius: 20px; border: 1px solid #d6dde5; background: #fff; background-image: linear-gradient(#eef2f6 1px, transparent 1px), linear-gradient(90deg, #eef2f6 1px, transparent 1px); background-size: 24px 24px; }
    .icon { width: 240px; height: 240px; display: block; flex: none; }
    .controls { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; margin: 22px 0 34px; }
    .eyebrow { color: #657080; }
    output { min-width: 54px; text-align: right; font-weight: 650; }
    input[type="range"] { width: 100%; accent-color: #1769cb; cursor: pointer; }
    input[type="range"]:focus-visible { outline: 2px solid #1769cb; outline-offset: 6px; }
    .scale-row { display: flex; justify-content: space-between; align-items: end; gap: 14px; overflow-x: auto; padding: 0 2px 8px; }
    .scale-item { min-width: 80px; display: grid; justify-items: center; gap: 13px; }
    .scale-item img { display: block; }
    .size-label { color: #657080; }
    @media (max-width: 520px) { header { display: block; } header span { display: block; margin-top: 8px; } .controls { grid-template-columns: 1fr auto; } .controls .eyebrow { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Codex Monitor</h1><span>Icon scale study</span></header>
    <div class="stage"><img id="main-icon" class="icon" src="./codex-monitor.svg?v=4" alt="Codex Monitor cloud and magnifying glass icon"></div>
    <div class="controls">
      <label class="eyebrow" for="size">Preview size</label>
      <input id="size" type="range" min="16" max="320" value="240" step="1">
      <output id="size-value" for="size">240 px</output>
    </div>
    <div class="scale-row" aria-label="Common icon sizes">
      <div class="scale-item"><img src="./codex-monitor.svg?v=4" width="16" height="16" alt=""><span class="size-label">16 px</span></div>
      <div class="scale-item"><img src="./codex-monitor.svg?v=4" width="24" height="24" alt=""><span class="size-label">24 px</span></div>
      <div class="scale-item"><img src="./codex-monitor.svg?v=4" width="32" height="32" alt=""><span class="size-label">32 px</span></div>
      <div class="scale-item"><img src="./codex-monitor.svg?v=4" width="64" height="64" alt=""><span class="size-label">64 px</span></div>
      <div class="scale-item"><img src="./codex-monitor.svg?v=4" width="128" height="128" alt=""><span class="size-label">128 px</span></div>
    </div>
  </main>
  <script>
    const slider = document.querySelector('#size');
    const icon = document.querySelector('#main-icon');
    const value = document.querySelector('#size-value');
    slider.addEventListener('input', () => {
      icon.style.width = icon.style.height = `${slider.value}px`;
      value.value = `${slider.value} px`;
    });
  </script>
</body>
</html>
